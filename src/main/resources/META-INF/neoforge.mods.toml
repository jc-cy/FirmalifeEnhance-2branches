description = '''独立的 TFC + Firmalife 兼容补丁。
提供温室与地窖的气象站控温、常见容器与 IE 木制储物箱 / 强化储物箱地窖兼容，以及温室建材拆解配方。
本版本新增大量配置项目，支持自定义热源/冷源、混合温室、配置化地窖墙体与温室/地窖墙体规则。
1.21 版本不包含 TFE 依赖；1.20 的 TFE 兼容内容在 1.21 中改接原生 TFC / Firmalife 内容。

中文声明
