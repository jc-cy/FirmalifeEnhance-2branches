Standalone TFC + Firmalife compatibility patch.
This version provides climate-station temperature control for greenhouses and cellars, common container and Immersive Engineering wooden/reinforced crate cellar compatibility, and greenhouse material salvage recipes.
It also adds extensive configuration options, including custom heating/cooling items, mixed greenhouses, configurable cellar walls, and greenhouse/cellar wall rules.
The 1.21 build does not depend on TFE; features that required TFE compatibility on 1.20 are handled through native TFC / Firmalife content on 1.21.

